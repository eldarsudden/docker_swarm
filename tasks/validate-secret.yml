---
- name: Validate the Swarm secret name
  ansible.builtin.assert:
    that:
      - _docker_swarm_secret_name is string
      - _docker_swarm_secret_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
    fail_msg: Use a Swarm secret name that starts with a letter or digit and contains only letters, digits, dots, underscores or hyphens.

- name: Validate the encrypted or plain Swarm secret value
  block:
    - name: Check that the secret value is nonempty text
      ansible.builtin.assert:
        that:
          - (docker_swarm_secrets[_docker_swarm_secret_name] is string or docker_swarm_secrets[_docker_swarm_secret_name] is vault_encrypted)
          - docker_swarm_secrets[_docker_swarm_secret_name] | length > 0
      no_log: true
  rescue:
    - name: Report the secret validation failure without its value
      ansible.builtin.fail:
        msg: >-
          Swarm secret {{ _docker_swarm_secret_name | to_json }}.
          {% if ansible_failed_result.assertion is defined %}
          Its value must be a nonempty string. Quote values that YAML would parse as numbers or booleans.
          {% elif (ansible_failed_result.msg | default('')) is search('(?i)decrypt|no vault secrets|vault password must') %}
          Ansible could not decrypt its value. Supply the matching Vault password using --ask-vault-pass or --vault-id.
          {% else %}
          Could not read its value. Check the variable reference and supply the matching
          Ansible Vault password if the value is encrypted.
          {% endif %}
