---
# raw keeps EL10's system Python independent of the Ansible version.
- name: Configure the Docker CE stable RPM repository
  ansible.builtin.raw: |
    set -eu
    . /etc/os-release
    major=${VERSION_ID%%.*}
    case "$major" in
      9|10) ;;
      *) echo "Unsupported OS version: $ID $VERSION_ID" >&2; exit 1 ;;
    esac
    case "$ID" in
      rhel|centos|rocky) distro=$ID ;;
      ol) distro=oracle ;;
      almalinux) distro=alma ;;
      *) echo "Unsupported OS: $ID" >&2; exit 1 ;;
    esac
    repo=/etc/yum.repos.d/docker-swarm-ce.repo
    enabled={{ docker_swarm_repo_enabled | bool | ternary('1', '0') }}
    if [ "$enabled" = 0 ] && [ ! -e "$repo" ]; then
      exit 0
    fi

    base_url="https://download.docker.com/linux/$distro"
    candidate=$(mktemp "${repo}.XXXXXX")
    trap 'rm -f -- "$candidate"' EXIT
    cat > "$candidate" <<EOF
    [docker-swarm-ce-stable]
    name=Docker CE Stable
    baseurl=$base_url/$major/\$basearch/stable
    enabled=$enabled
    gpgcheck=1
    gpgkey=$base_url/gpg
    EOF
    if ! cmp -s -- "$candidate" "$repo"; then
      chmod 0644 "$candidate"
      mv -f -- "$candidate" "$repo"
      echo DOCKER_SWARM_CHANGED
    fi
  register: _docker_swarm_repo
  changed_when: "'DOCKER_SWARM_CHANGED' in _docker_swarm_repo.stdout_lines"

- name: Install Docker CE, containerd and Docker CLI plugins
  ansible.builtin.raw: |
    set -eu
    set -- docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    if ! rpm -q -- "$@" >/dev/null; then
      dnf -y install "$@"
      echo DOCKER_SWARM_CHANGED
    fi
  register: _docker_swarm_packages
  changed_when: "'DOCKER_SWARM_CHANGED' in _docker_swarm_packages.stdout_lines"

- name: Apply daemon.json to each configured host in sequence
  ansible.builtin.include_tasks: daemon.yml
  run_once: true
  vars:
    _docker_swarm_desired_daemon_config: >-
      {{ _docker_swarm_default_daemon_config |
         combine(hostvars[_docker_swarm_daemon_host].docker_swarm_daemon_config | default({}), recursive=true) }}
  when:
    - not ansible_check_mode
    - hostvars[_docker_swarm_daemon_host].get('docker_swarm_daemon_config', {}) is not none
  loop: "{{ ansible_play_batch }}"
  loop_control:
    loop_var: _docker_swarm_daemon_host

- name: Enable and start the Docker service
  ansible.builtin.raw: |
    set -eu
    if ! systemctl is-enabled --quiet docker.service; then
      systemctl enable docker.service
      echo DOCKER_SWARM_CHANGED
    fi
    if ! systemctl is-active --quiet docker.service; then
      systemctl start docker.service
      echo DOCKER_SWARM_CHANGED
    fi
  register: _docker_swarm_service
  changed_when: "'DOCKER_SWARM_CHANGED' in _docker_swarm_service.stdout_lines"
