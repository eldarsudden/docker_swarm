---
- name: Install Docker and configure Swarm
  become: true
  any_errors_fatal: true
  block:
    - name: Validate the Swarm bootstrap manager
      ansible.builtin.assert:
        that:
          - docker_swarm_bootstrap_host in _docker_swarm_managers
        fail_msg: >-
          docker_swarm_bootstrap_host={{ docker_swarm_bootstrap_host | to_json }}
          must match the inventory hostname of a detected Swarm manager.
          Detected managers: {{ _docker_swarm_managers | to_json }}.
          Inventory group: {{ docker_swarm_inventory_group | default('automatic', true) | to_json }}.
          Set docker_swarm_node_role to manager on a cluster member.
          To select a cluster from a shared inventory, set docker_swarm_inventory_group.
      run_once: true

    - name: Validate Swarm inventory and play batch
      ansible.builtin.assert:
        that:
          - docker_swarm_bootstrap_host in ansible_play_batch
          - _docker_swarm_managers | intersect(_docker_swarm_workers) | length == 0
          - _docker_swarm_members | difference(_docker_swarm_managers + _docker_swarm_workers) | length == 0
          - ansible_play_hosts_all | difference(ansible_play_batch) | length == 0
          - ansible_play_batch | difference(_docker_swarm_members) | length == 0
        fail_msg: >-
          Run in one linear play batch containing docker_swarm_bootstrap_host.
          Set docker_swarm_node_role to manager or worker, or use one legacy role group per host.
      run_once: true

    - name: Validate Swarm addresses
      ansible.builtin.assert:
        that:
          - docker_swarm_advertise_addr is string
          - docker_swarm_advertise_addr | trim | length > 0
          - docker_swarm_listen_addr is string
          - docker_swarm_listen_addr | trim | length > 0
          - docker_swarm_data_path_addr is string
        fail_msg: Set docker_swarm_advertise_addr to the IP or interface on the Swarm network.

    - name: Validate the Swarm overlay pool settings
      ansible.builtin.assert:
        that:
          - docker_swarm_default_addr_pools is sequence
          - docker_swarm_default_addr_pools is not string
          - docker_swarm_default_addr_pools is not mapping
          - >-
            docker_swarm_default_addr_pool_mask_length is none or
            (docker_swarm_default_addr_pools | length > 0 and
             docker_swarm_default_addr_pool_mask_length is integer and
             1 <= docker_swarm_default_addr_pool_mask_length <= 32)
        fail_msg: Specify a list of overlay pools and an optional integer subnet prefix length.
      run_once: true

    - name: Validate the daemon configuration variable
      ansible.builtin.assert:
        that:
          - docker_swarm_daemon_config is mapping
          - >-
            'data-root' not in docker_swarm_daemon_config or
            (docker_swarm_daemon_config['data-root'] is string and
             docker_swarm_daemon_config['data-root'].startswith('/'))
        fail_msg: Set docker_swarm_daemon_config to a YAML mapping of dockerd options.
      when: docker_swarm_daemon_config is not none

    - name: Validate the node labels mapping
      ansible.builtin.assert:
        that:
          - docker_swarm_node_labels is mapping
        fail_msg: Set docker_swarm_node_labels to a mapping of Swarm node labels.

    - name: Validate Swarm node labels
      ansible.builtin.assert:
        that:
          - item.key is string and item.key is match('^[^=\\s]+$')
          - item.value is string or item.value is boolean or item.value is number
        fail_msg: Use nonempty label names without spaces or equals signs and scalar label values.
      loop: "{{ docker_swarm_node_labels | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate the Swarm stacks mapping
      ansible.builtin.assert:
        that:
          - docker_swarm_stacks is mapping
        fail_msg: Set docker_swarm_stacks to a mapping.
      run_once: true

    - name: Read the Swarm secret names
      run_once: true
      block:
        - name: Validate the Swarm secrets mapping
          ansible.builtin.assert:
            that:
              - docker_swarm_secrets is mapping
          no_log: true

        - name: Record configured Swarm secret names
          ansible.builtin.set_fact:
            _docker_swarm_secret_names: "{{ docker_swarm_secrets.keys() | list }}"
          no_log: true
      rescue:
        - name: Report an unreadable Swarm secrets mapping
          ansible.builtin.fail:
            msg: >-
              {% if ansible_failed_result.assertion is defined %}
              Set docker_swarm_secrets to a mapping of secret names to text values.
              {% else %}
              Could not read docker_swarm_secrets. Check its variable references and supply
              the matching Ansible Vault password if it contains encrypted values.
              {% endif %}

    - name: Validate configured Swarm secrets
      ansible.builtin.include_tasks: validate-secret.yml
      loop: "{{ _docker_swarm_secret_names }}"
      loop_control:
        loop_var: _docker_swarm_secret_name
      run_once: true

    - name: Validate Swarm stack entries
      ansible.builtin.assert:
        that:
          - item.key is string and item.key is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
          - item.value is string and item.value | trim | length > 0
        fail_msg: Set each stack name to a path to a Compose file on the control node.
      loop: "{{ docker_swarm_stacks | dict2items }}"
      run_once: true

    - name: Apply Docker and Swarm configuration
      when: not ansible_check_mode
      block:
        - name: Install and start Docker Engine
          ansible.builtin.import_tasks: install.yml

        - name: Configure Swarm membership
          ansible.builtin.import_tasks: swarm.yml
