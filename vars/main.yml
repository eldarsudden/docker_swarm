---
_docker_swarm_standard_members: >-
  {{ (groups.get('docker_swarm', []) + groups.get('docker_swarm_managers', []) +
      groups.get('docker_swarm_workers', [])) | unique | list }}
_docker_swarm_discover_by_role: >-
  {{ not docker_swarm_inventory_group and
     ansible_play_hosts_all | difference(_docker_swarm_standard_members) | length > 0 }}
_docker_swarm_candidate_hosts: >-
  {%- if _docker_swarm_discover_by_role -%}
  {{ groups['all'] }}
  {%- elif docker_swarm_inventory_group and docker_swarm_inventory_group != 'docker_swarm' -%}
  {{ groups.get(docker_swarm_inventory_group, []) }}
  {%- else -%}
  {{ _docker_swarm_standard_members }}
  {%- endif -%}
# Read only the role field. Rendering a whole hostvars mapping can decrypt unrelated Vault values.
_docker_swarm_roles_by_host: >-
  {%- set inventory = namespace(roles=[]) -%}
  {%- for host in _docker_swarm_candidate_hosts if hostvars[host].docker_swarm_node_role is defined -%}
    {%- set inventory.roles = inventory.roles + [(host, hostvars[host].docker_swarm_node_role)] -%}
  {%- endfor -%}
  {{ dict(inventory.roles) }}
_docker_swarm_members: >-
  {{ _docker_swarm_roles_by_host.keys() | list if _docker_swarm_discover_by_role else _docker_swarm_candidate_hosts }}
_docker_swarm_explicit_hosts: >-
  {{ _docker_swarm_members | select('in', _docker_swarm_roles_by_host) | list }}
_docker_swarm_implicit_hosts: >-
  {{ _docker_swarm_members | reject('in', _docker_swarm_roles_by_host) | list }}
_docker_swarm_managers: >-
  {{ (_docker_swarm_explicit_hosts | select('in', _docker_swarm_roles_by_host | dict2items |
      selectattr('value', 'equalto', 'manager') | map(attribute='key') | list) | list) +
     (_docker_swarm_implicit_hosts | select('in', groups.get('docker_swarm_managers', [])) | list) }}
_docker_swarm_workers: >-
  {{ (_docker_swarm_explicit_hosts | select('in', _docker_swarm_roles_by_host | dict2items |
      selectattr('value', 'equalto', 'worker') | map(attribute='key') | list) | list) +
     (_docker_swarm_implicit_hosts | select('in', groups.get('docker_swarm_workers', [])) | list) }}
_docker_swarm_cli: docker --host unix:///var/run/docker.sock
_docker_swarm_node_format: !unsafe '{{.Swarm.LocalNodeState}} {{.Swarm.NodeID}}'
_docker_swarm_role_format: !unsafe '{{.Spec.Role}}'
_docker_swarm_labels_format: !unsafe '{{json .Spec.Labels}}'
_docker_swarm_secret_name_format: !unsafe '{{.Name}}'
_docker_swarm_status_format: !unsafe '{{.Spec.Role}} {{.Status.State}}'
_docker_swarm_manager_format: !unsafe '{{.ManagerStatus.Addr}}'
_docker_swarm_node_id: >-
  {{ (_docker_swarm_joined_node if _docker_swarm_state == 'inactive' else _docker_swarm_info).stdout.split()[1] }}
_docker_swarm_network_flags: >-
  --advertise-addr={{ docker_swarm_advertise_addr | quote }}
  --listen-addr={{ docker_swarm_listen_addr | quote }}
  {% if docker_swarm_data_path_addr %}
  --data-path-addr={{ docker_swarm_data_path_addr | quote }}
  {% endif %}
