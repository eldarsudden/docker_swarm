---
all:
  # Optional shared settings. Choose pools before the first Swarm initialization.
  # vars:
  #   docker_swarm_default_addr_pools:
  #     - "10.240.0.0/16"
  #   docker_swarm_default_addr_pool_mask_length: 24
  #   docker_swarm_daemon_config:
  #     log-driver: json-file
  #     log-opts:
  #       max-size: "100m"
  #       max-file: "5"
  #     max-concurrent-downloads: 3
  #     max-concurrent-uploads: 5
  #     debug: false
  #     selinux-enabled: false
  #     ip: "0.0.0.0"
  #     group: docker
  #     insecure-registries: []
  #     bip: "172.16.0.1/24"
  #     fixed-cidr: "172.16.0.0/24"
  children:
    docker_swarm:
      vars:
        # Replace ens192 with the interface used by Swarm on these hosts.
        docker_swarm_advertise_addr: ens192
      hosts:
        swarm-m1:
          docker_swarm_node_role: manager
        swarm-m2:
          docker_swarm_node_role: manager
        swarm-m3:
          docker_swarm_node_role: manager
        swarm-w1:
          docker_swarm_node_role: worker
